name: Migration Governance

on:
  pull_request:
    paths:
      - "drizzle/**"
      - "scripts/migration-*.cjs"
      - "scripts/lib/migration-governance-lib.cjs"
      - "scripts/verify-schema-deployment.cjs"
      - "scripts/recovery/**"
      - "package.json"
      - "vercel.json"
  push:
    branches: [main, master]
    paths:
      - "drizzle/**"
      - "scripts/migration-*.cjs"
      - "scripts/lib/migration-governance-lib.cjs"
      - "scripts/verify-schema-deployment.cjs"

jobs:
  governance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # CI-PNPM-GOVERNANCE-ALIGNMENT-1 — single authority: package.json#packageManager.
      # Do not pass `version` here; pnpm/action-setup@v4 rejects dual declaration
      # (exact "10.4.1" vs packageManager "pnpm@10.4.1+sha512...").
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Migration governance guard
        run: node scripts/migration-governance-guard.cjs

      - name: Migration governance regression tests
        run: pnpm exec vitest run scripts/__tests__/migrationGovernance.test.ts
