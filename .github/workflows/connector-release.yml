name: Connector Release

on:
  push:
    tags:
      - "connector-v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Connector release version (must match connector-release.json)"
        required: false
        type: string

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  release:
    name: Build Publish Verify Smoke Promote Activate
    runs-on: windows-latest
    env:
      RELEASE_GIT_TAG: ${{ github.ref_name }}
      RELEASE_COMMIT_SHA: ${{ github.sha }}
      RELEASE_WORKFLOW_RUN_ID: ${{ github.run_id }}
      RELEASE_PUBLISHER: ${{ github.actor }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
      R2_PUBLIC_BASE_URL: ${{ secrets.R2_PUBLIC_BASE_URL }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      CONNECTOR_SIGNING_PFX_BASE64: ${{ secrets.CONNECTOR_SIGNING_PFX_BASE64 }}
      CONNECTOR_SIGNING_CERT_PASSWORD: ${{ secrets.CONNECTOR_SIGNING_CERT_PASSWORD }}
      CONNECTOR_SIGNING_TIMESTAMP_URL: http://timestamp.digicert.com

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Resolve release version
        id: version
        shell: pwsh
        run: |
          $manifest = Get-Content connector-product/release/connector-release.json -Raw | ConvertFrom-Json
          $requested = "${{ inputs.version }}"
          if ($requested) {
            if ($requested -ne $manifest.version) {
              throw "Requested version $requested does not match release authority $($manifest.version)"
            }
            $version = $requested
          } elseif ("${{ github.ref_type }}" -eq "tag") {
            $tag = "${{ github.ref_name }}"
            if ($tag -notmatch '^connector-v(.+)$') { throw "Tag must match connector-v<version>" }
            $version = $Matches[1]
            if ($version -ne $manifest.version) {
              throw "Tag version $version does not match release authority $($manifest.version)"
            }
          } else {
            $version = $manifest.version
          }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Locate signtool
        shell: pwsh
        run: |
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Recurse -Filter signtool.exe -File -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match '\\x64\\signtool\.exe$' } |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if (-not $signtool) {
            throw "signtool.exe not found on runner. Install Windows SDK signing tools."
          }
          "CONNECTOR_SIGNTOOL_PATH=$($signtool.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "Using signtool at $($signtool.FullName)"

      - name: Register release candidate
        run: npx tsx scripts/connector-release-automation.ts candidate --version ${{ steps.version.outputs.version }}

      - name: Build connector release
        shell: pwsh
        run: ./connector-product/windows/build-release.ps1 -SkipPublish -SkipFinalize

      - name: Prepare code signing credentials
        shell: pwsh
        run: ./connector-product/windows/prepare-connector-signing.ps1

      - name: Sign connector installer
        shell: pwsh
        run: ./connector-product/windows/sign-release.ps1

      - name: Verify Authenticode signature
        shell: pwsh
        run: ./connector-product/windows/verify-release-signature.ps1

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/connector-release/${{ steps.version.outputs.version }}/MineuQR-Connector-${{ steps.version.outputs.version }}-Setup.exe
            dist/connector-release/${{ steps.version.outputs.version }}/release-manifest.json
            dist/connector-release/${{ steps.version.outputs.version }}/SHA256SUMS.txt

      - name: Publish release to R2
        run: npx tsx scripts/connector-release-automation.ts publish --version ${{ steps.version.outputs.version }}

      - name: Verify release integrity
        run: npx tsx scripts/connector-release-automation.ts verify --version ${{ steps.version.outputs.version }}

      - name: Smoke test installer
        run: npx tsx scripts/connector-release-automation.ts smoke-test --version ${{ steps.version.outputs.version }}

      - name: Upload smoke test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: connector-smoke-diagnostics-${{ steps.version.outputs.version }}
          path: dist/connector-release/${{ steps.version.outputs.version }}/smoke-diagnostics/
          if-no-files-found: warn

      - name: Promote release
        run: npx tsx scripts/connector-release-automation.ts promote --version ${{ steps.version.outputs.version }}

      - name: Activate release
        run: npx tsx scripts/connector-release-automation.ts activate --version ${{ steps.version.outputs.version }}

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: connector-release-${{ steps.version.outputs.version }}
          path: dist/connector-release/${{ steps.version.outputs.version }}/
          if-no-files-found: error
