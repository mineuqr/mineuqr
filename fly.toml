# THERMAL-PRINTING-12E.1B — Fly.io Agent Host deployment
# Apply with: fly launch --no-deploy && fly secrets set ... && fly deploy

app = "mineuqr-print-host"
primary_region = "fra"

[build]
  dockerfile = "Dockerfile.print-host"

[env]
  NODE_ENV = "production"
  PORT = "8080"
  TRUST_PROXY = "true"
  PRINT_HOST_PUBLIC_URL = "https://print.mineuqr.com"
  PRINT_HOST_CORS_ORIGINS = "https://mineuqr.com,https://www.mineuqr.com"
  SESSION_COOKIE_DOMAIN = ".mineuqr.com"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    grace_period = "15s"
    interval = "30s"
    method = "GET"
    path = "/health"
    timeout = "5s"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
